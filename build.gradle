plugins {
    id 'java'
    id 'application'
    id 'jacoco'
    id "org.springframework.boot" version "${springBootVersion}"
    id "io.spring.dependency-management" version "${springDependencyManagementVersion}"
    id "com.github.ben-manes.versions" version "${benmanesVersion}"
    id "net.ltgt.errorprone" version "${errorpronePluginVersion}"
    id "net.ltgt.nullaway" version "${nullawayPluginVersion}"
    id "com.github.spotbugs" version "${spotbugsPluginVersion}"
    id "org.sonarqube" version "${sonarqubePluginVersion}"
}

group = 'de.zettsystems'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion as int)
    }
}

application {
    mainClass = 'de.zettsystems.h3comsim.ComSimApp'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
    implementation "com.google.guava:guava:${guavaVersion}"
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    implementation "ch.qos.logback:logback-core:${logbackVersion}"
    implementation "org.jspecify:jspecify:${jspecifyVersion}"
    runtimeOnly "ch.qos.logback:logback-classic:${logbackVersion}"

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"

    errorprone "com.google.errorprone:error_prone_core:${errorproneVersion}"
    errorprone "com.uber.nullaway:nullaway:${nullawayVersion}"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}


import com.github.spotbugs.snom.SpotBugsTask
import net.ltgt.gradle.errorprone.CheckSeverity
import org.gradle.internal.os.OperatingSystem

tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        disableWarningsInGeneratedCode = true
        nullaway {
            severity = CheckSeverity.ERROR
            annotatedPackages.add("de.zettsystems.h3comsim")
        }
    }
}

tasks.named("compileJava").configure {
    options.compilerArgs << '-Werror'
}

tasks.named("compileTestJava") {
    options.errorprone.enabled = false
}

spotbugs {
    effort = 'MAX'
    reportLevel = 'LOW'
    excludeFilter = file('config/spotbugs/exclude.xml')
}

//noinspection GroovyAssignabilityCheck
tasks.withType(SpotBugsTask).configureEach {
    reports {
        html { required = true }
        sarif { required = true }
    }
}

// ----- Frontend integration: build React/Vite assets and ship them inside the boot jar.

def npmExecutable = OperatingSystem.current().isWindows() ? 'npm.cmd' : 'npm'
def frontendDir = file('frontend')
def frontendDist = file('frontend/dist')

tasks.register('frontendInstall', Exec) {
    group = 'frontend'
    description = 'npm install im frontend/'
    workingDir = frontendDir
    inputs.file('frontend/package.json')
    inputs.file('frontend/package-lock.json')
    outputs.dir('frontend/node_modules')
    commandLine npmExecutable, 'install', '--no-audit', '--no-fund'
}

tasks.register('frontendBuild', Exec) {
    group = 'frontend'
    description = 'Vite-Build → frontend/dist'
    dependsOn 'frontendInstall'
    workingDir = frontendDir
    inputs.dir('frontend/src')
    inputs.file('frontend/index.html')
    inputs.file('frontend/vite.config.ts')
    inputs.file('frontend/tsconfig.json')
    inputs.file('frontend/tsconfig.app.json')
    inputs.file('frontend/package.json')
    outputs.dir(frontendDist)
    commandLine npmExecutable, 'run', 'build'
}

processResources {
    dependsOn 'frontendBuild'
    from(frontendDist) {
        into 'static'
    }
}

clean {
    delete frontendDist
}

jacoco {
    toolVersion = '0.8.13'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.60
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn 'jacocoTestCoverageVerification'
}

sonar {
    properties {
        property 'sonar.projectKey', 'heroes3cosim'
        property 'sonar.projectName', 'heroes3-combat-simulator'
        property 'sonar.host.url', 'http://localhost:9000'

        def sonarTokenValue = findProperty('sonar.token') ?: System.getenv('SONAR_TOKEN')
        if (sonarTokenValue) {
            property 'sonar.token', sonarTokenValue
        }

        property 'sonar.sources', 'src/main/java,frontend/src'
        property 'sonar.tests', 'src/test/java,frontend/src'
        property 'sonar.test.inclusions',
                'src/test/java/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**'
        property 'sonar.exclusions',
                'frontend/dist/**,frontend/node_modules/**,frontend/coverage/**,frontend/*.tsbuildinfo,build/**'
        // i18n-Locale-Dateien spiegeln per Definition dieselbe Key-Struktur — Sonar liest das
        // als 90+ % Duplikate. Aus dem CPD-Scan ausschliessen.
        property 'sonar.cpd.exclusions', 'frontend/src/shared/i18n/locales/**'

        property 'sonar.java.source', "${javaVersion}"
        property 'sonar.sourceEncoding', 'UTF-8'

        property 'sonar.coverage.jacoco.xmlReportPaths',
                "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
        property 'sonar.javascript.lcov.reportPaths', 'frontend/coverage/lcov.info'
    }
}

tasks.register('frontendCoverage', Exec) {
    group = 'frontend'
    description = 'Vitest mit Coverage → frontend/coverage/lcov.info'
    dependsOn 'frontendInstall'
    workingDir = frontendDir
    inputs.dir('frontend/src')
    inputs.file('frontend/vite.config.ts')
    inputs.file('frontend/package.json')
    outputs.file('frontend/coverage/lcov.info')
    commandLine npmExecutable, 'run', 'coverage'
}

tasks.named('sonar').configure {
    dependsOn 'test', 'jacocoTestReport', 'spotbugsMain', 'spotbugsTest', 'frontendCoverage'
}

def depUpdateIsUnstable = { String version ->
    def stableKeywords = ['RELEASE', 'FINAL', 'GA']
    def stable = stableKeywords.any { version.toUpperCase().contains(it) }
    def numericLooking = version ==~ /^[0-9,.v-]+(-r)?$/
    return !stable && !numericLooking
}
def depUpdateIsMajorBump = { String current, String candidate ->
    def cur = current.split(/[.\-]/, 2)[0]
    def cand = candidate.split(/[.\-]/, 2)[0]
    return cur.isInteger() && cand.isInteger() && cand.toInteger() > cur.toInteger()
}
dependencyUpdates {
    //noinspection GroovyAssignabilityCheck
    rejectVersionIf { selection ->
        def allowUnstable = project.hasProperty('unstable')
        def allowMajor = project.hasProperty('major')
        if (!allowUnstable
                && depUpdateIsUnstable(selection.candidate.version)
                && !depUpdateIsUnstable(selection.currentVersion)) {
            return true
        }
        if (!allowMajor
                && depUpdateIsMajorBump(selection.currentVersion, selection.candidate.version)) {
            return true
        }
        return false
    }
}
