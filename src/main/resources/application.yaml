spring:
  application:
    name: heroes3-combat-simulator

server:
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    build:
      enabled: true
    git:
      enabled: true
      mode: simple

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    de.zettsystems.h3comsim: INFO

h3:
  experiment:
    # Prozentualer Anteil der verfügbaren CPU-Kerne, der für Matrix-Läufe genutzt wird
    # (min. 1 Thread). Default 50 % — die andere Hälfte bleibt für IDE/Browser/OS frei.
    parallelism-percent: 50
